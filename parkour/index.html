<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parkour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap"><canvas id="game" width="1920" height="1080"></canvas></div>
  <p class="hint">Space / W / click — jump (hold to keep jumping; orbs react to Space/W only) · Esc — pause · S — settings (game speed, skin) · F — fullscreen · M — sound</p>
  <input type="file" id="skin" accept="image/*" hidden>
  <script src="game.js"></script>
</body>
</html>
